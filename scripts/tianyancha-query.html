<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Tianyancha Query</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, #app { width: 100%; height: 100%; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { connect } from 'https://registry.openclaw.ai/proxy/npm/@openclaw/browser-act@0.1.30/+esm';

const SESSION = 'tianyancha-query';
const TARGET = 'https://www.tianyancha.com/search?key=%E5%8C%97%E4%BA%AC%E5%AD%97%E8%8A%82%E8%B7%B3%E5%8A%A8%E7%A7%91%E6%8A%80%E6%9C%89%E9%99%90%E5%85%AC%E5%8F%B8';

async function init() {
  const app = document.getElementById('app');

  // 创建 iframe 承载浏览器
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'width:100%;height:100%;border:none;';
  app.appendChild(iframe);

  // 连接 browser-act
  const client = await connect({ mode: 'chrome', sessionId: SESSION });
  console.log('Connected to browser-act:', SESSION);

  // 导航到目标 URL（会自动打开新标签页）
  await client.navigate(TARGET);
  console.log('Navigated to tianyancha search');

  // 持续监控登录状态
  let loginChecked = false;
  const checkLogin = setInterval(async () => {
    if (loginChecked) return;
    try {
      const state = await client.state();
      const url = state?.url || '';
      if (!url.includes('login') && !url.includes('login.html')) {
        loginChecked = true;
        clearInterval(checkLogin);
        console.log('Login detected! URL:', url);
        document.title = '✅ 已登录 - 开始查询';
        await client.evaluate(`
          () => {
            const status = document.createElement('div');
            status.style.cssText = 'position:fixed;top:10px;right:10px;background:#4CAF50;color:white;padding:10px 20px;border-radius:4px;z-index:99999;font-family:sans-serif;font-size:14px;';
            status.textContent = '✅ 已登录，查询中...';
            document.body.appendChild(status);
            return 'logged_in';
          }
        `);
      } else if (url.includes('login')) {
        document.title = '⏳ 请登录天眼查';
      }
    } catch(e) {
      // ignore
    }
  }, 2000);

  // 暴露全局 API 供外部控制
  window.__tianyancha__ = {
    client,
    session: SESSION,
    async search(company) {
      await client.navigate(`https://www.tianyancha.com/search?key=${encodeURIComponent(company)}`);
      await new Promise(r => setTimeout(r, 3000));
      const result = await client.getMarkdown();
      return result;
    },
    async getState() {
      return client.state();
    }
  };

  console.log('Ready. Browser is open.');
}

init().catch(err => {
  console.error('Failed to initialize:', err);
  document.body.innerHTML = `<div style="padding:20px;color:red;">
    <h2>初始化失败</h2>
    <p>${err.message}</p>
    <p>请确保 browser-act chrome 进程正在运行：</p>
    <pre>browser-act browser open default "https://www.tianyancha.com" --session tianyancha-query</pre>
  </div>`;
});
</script>
</body>
</html>
