[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-factory"
version = "0.1.0"
description = "投资分析策略工厂 - AI 驱动研究"
requires-python = ">=3.10"

dependencies = [
    # 数据处理
    "pandas>=2.0",
    "numpy>=1.24",
    
    # 数据获取
    "akshare>=1.10",  # A 股数据
    "yfinance>=0.2",  # 美股/港股数据
    
    # 技术分析
    "ta-lib>=0.4",
    "pandas-ta>=0.3",
    
    # 回测
    "backtrader>=1.9",
    "vectorbt>=0.25",
    
    # 可视化
    "matplotlib>=3.7",
    "plotly>=5.15",
    
    # AI 接口
    "openai>=1.0",
    
    # 日志
    "loguru>=0.7",
    
    # 配置
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
]
