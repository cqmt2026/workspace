# ML模型训练参数
# ================

lightgbm:
  num_leaves: 31
  learning_rate: 0.05
  n_estimators: 200
  early_stopping_rounds: 20
  max_depth: 5
  min_data_in_leaf: 20
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 5
  lambda_l1: 0.1
  lambda_l2: 0.1

training:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  random_seed: 42
  quick_epochs: 50
  full_epochs: 200