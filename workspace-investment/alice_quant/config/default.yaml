# AliceQuant 默认配置
# 复制为 custom.yaml 并修改

# 数据层配置
data:
  db_path: "F:/market_data.db"       # 数据库路径
  primary_source: "db"                      # 主力数据源 (本地DB)
  backup_sources:                     # 备用数据源 (API降级)
    - "tencent"
    - "efinance"
    - "akshare"
  cache_max_mb: 500                   # 缓存上限(MB)
  quality_threshold: 70               # 质量阈值(低于此值降级)

# 特征工程配置
features:
  ic_window: 60                       # IC滚动窗口(天)
  ic_alert_days: 10                   # IC连续为负告警天数
  max_factors: 200                    # 最大因子数量

# 模型训练配置
models:
  train_frequency: "monthly"          # 训练频率
  train_time: "20:00"                 # 训练时间
  model_dir: "data/models/"           # 模型存储目录
  retrain_on_degradation: true        # 退化时自动重训
  degradation_threshold: 0.02         # IC退化阈值

# 回测配置
backtest:
  initial_capital: 1000000            # 初始资金(元)
  commission_rate: 0.00025            # 佣金率(万2.5)
  stamp_tax_rate: 0.001               # 印花税率(千1)
  transfer_fee_rate: 0.00001          # 过户费(万0.1)
  min_commission: 5.0                 # 最低佣金(元)
  slippage:
    model: "fixed"                    # 滑点模型: fixed/ratio/vwap
    fixed: 0.001                      # 固定滑点(0.1%)
    ratio: 0.001                      # 比例滑点
  volume_limit:
    single: 0.1                       # 单笔不超过日成交量的10%
    cumulative: 0.3                   # 累计不超过日均成交量的30%
  tail_slippage: 0.001                # 尾盘模拟滑点(0.1%)

# 风控配置
risk:
  max_single_position: 0.20           # 单只股票最大仓位
  max_industry_exposure: 0.30         # 单行业最大暴露
  max_positions: 10                   # 最大持仓数量
  min_cash_ratio: 0.05                # 最低现金比例
  stop_loss: 0.05                     # 单笔止损(-5%)
  trailing_stop: 0.10                 # 移动止损(回撤10%)
  portfolio_stop: 0.15                # 组合止损(-15%)

# 日志配置
logger:
  level: "INFO"                       # 日志级别
  log_dir: "data/logs/"               # 日志目录
  structured_log: true                # 是否输出结构化日志

# 模拟交易配置
paper_trading:
  mode: "cron"                        # 模式: cron/realtime
  cron_time: "45 14 * * 1-5"          # Cron时间(周一到五14:45)