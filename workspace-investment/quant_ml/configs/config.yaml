# ============================================================
# Quant ML Framework - 统一配置文件
# ============================================================
# 修改此处即可改变所有行为，无需动代码
# ============================================================

data:
  # 数据源：全量pickle（来自market_data.db，2026-06-20重建）
  # 覆盖: 沪市主板1048 + 科创板576 + 深市主板1417 + 创业板1357 = 4398只
  # 样本量: ~695K（每8日采样），是旧数据的3.3倍
  source_pickle: "data/all_kline_full.pkl"
  # 备选：直接连接数据库
  source_db: "F:/market_data.db"

  # 原始数据参数
  min_history_days: 250   # 跳过历史不足250日的股票
  sample_interval: 5      # 每5个交易日取一个样本（配合周频预测）
  lookahead: 10           # v5: 预测10日后涨跌（周频，提高信噪比）

  # 特征构建参数
  features:
    ret_periods: [1, 3, 5, 10, 20, 60]           # 收益率周期
    vol_periods: [20]                              # 波动率周期
    ma_periods: [5, 20, 60]                       # 均线周期
    bbp_periods: [20]                              # 布林带周期
    macd: true                                     # MACD指标
    kdj: true                                      # KDJ指标
    rsi_periods: [14]                             # RSI周期
    obv: true                                      # OBV指标
    bias_periods: [5, 20]                         # 乖离率周期
    ppos_periods: [20, 60]                        # 位置周期
    gap_features: true                              # 缺口特征
    market_factor: true                            # 市场因子（重要！）

  # 市场因子（重要增强）
  market:
    proxy: "equal_weight_index"  # 用所有股票等权收益率作为大盘代理
    market_factor_col: "mkt_ret1"

model:
  name: "lightgbm"
  type: "binary_classification"

  lightgbm:
    objective: "binary"
    metric: "auc"
    boosting_type: "gbdt"
    n_estimators: 500
    learning_rate: 0.02
    num_leaves: 31          # v9: 48->31降低内存占用
    max_depth: 6            # v9: 8->6降低内存占用
    min_child_samples: 40    # v9: 60->40，允许更细粒度分裂
    feature_fraction: 0.7    # v7修复: 0.75->0.7
    bagging_fraction: 0.75   # v7修复: 0.8->0.75
    bagging_freq: 5
    reg_alpha: 0.01         # v9: 降低正则化(0.1->0.01)，允许更复杂模型
    reg_lambda: 0.05         # v9: 降低正则化(0.2->0.05)
    is_unbalance: true   # v2修复: 自动处理类别不平衡（原scale_pos_weight:1.0导致概率整体偏左）
    verbose: -1
    random_state: 42
    n_jobs: 2               # 限制线程数避免OOM (8GB内存)

training:
  # 数据分割 (chronological)
  train_ratio: 0.70
  early_stop_ratio: 0.10   # 从train中再切10%用于早停
  val_ratio: 0.20        # 最终验证（不参与训练）

  # 早停参数
  early_stop:
    patience: 30           # 30轮不改善则停止
    metric: "auc"         # 用auc判断
    verbose: True

  # 输出控制
  checkpoint_every: 50      # 每50轮输出一次
  save_model: true
  save_top_k: 3           # 保存top3模型

  # 日志
  log_format: "jsonl"     # jsonl格式便于解析
  log_dir: "quant_ml/logs"

evaluation:
  # 回测参数
  initial_capital: 100000
  commission_rate: 0.0003
  slippage: 0.001

  # 评估指标
  metrics:
    - accuracy
    - auc
    - f1
    - precision
    - recall
    - sharpe_ratio      # 年化夏普
    - max_drawdown      # 最大回撤
    - win_rate          # 胜率

  # 输出
  report_format: ["json", "md"]
  feature_importance_top_k: 15

paths:
  data_dir: "quant_ml/data"
  feature_dir: "quant_ml/data/features"
  model_dir: "quant_ml/data/models"
  log_dir: "quant_ml/logs"
