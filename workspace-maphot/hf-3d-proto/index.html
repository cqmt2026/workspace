const tl = gsap.timeline({paused:true,onUpdate:function(){renderer.render(scene,camera);}});
// 持续旋转地形
tl.to(terrain.rotation, {y:terrain.rotation.y+Math.PI*2,duration:5,ease:'none'});
tl.to(stars.rotation, {y:stars.rotation.y+Math.PI*0.5,duration:5,ease:'none'},0);
window.__timelines['main'] = tl;

document.addEventListener('hf-seek', function(e) {
  const { detail } = e;
  if (detail && detail.compositionId === 'main') {
    tl.seek(detail.time);
  }
});
</script>
