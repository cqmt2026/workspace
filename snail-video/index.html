<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0f0f1a; }
    body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    @font-face { font-family: 'PingFang SC'; src: local('PingFang SC'); }
    @font-face { font-family: 'Microsoft YaHei'; src: local('Microsoft YaHei'); }
    .clip { position: absolute; width: 1080px; height: 1920px; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .cover-title { font-size: 72px; color: #fff; text-align: center; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .cover-sub { font-size: 32px; color: #4ecdc4; text-align: center; margin-top: 20px; }
    .field { position: relative; width: 800px; height: 400px; background: linear-gradient(180deg, #2d5a1e, #1a3a0f); border-radius: 20px; overflow: hidden; }
    .grass-blade { position: absolute; bottom: 0; background: linear-gradient(0deg, #4a8c2a, #6fbf4a); border-radius: 2px 2px 0 0; }
    .cow { position: absolute; font-size: 80px; line-height: 1; z-index: 10; }
    .manim-frame { position: absolute; width: 1080px; height: 1920px; left: 0; top: 0; }
    .manim-frame img { width: 100%; height: 100%; object-fit: contain; }
    .formula-card { background: rgba(0,0,0,0.6); border-radius: 20px; padding: 50px 40px; width: 800px; margin-top: 20px; }
    .formula-text { font-size: 44px; color: #ffd93d; text-align: center; line-height: 1.5; }
    .formula-text.green { color: #4ecdc4; }
    .formula-text.red { color: #ff6b6b; }
    .highlight { color: #ff6b6b; font-size: 56px; }
    .answer-big { font-size: 80px; color: #4ecdc4; text-shadow: 0 0 20px rgba(78,205,196,0.5); }
    .section-tag { display: inline-block; background: #4ecdc4; color: #0f0f1a; font-size: 24px; padding: 8px 24px; border-radius: 20px; margin-bottom: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="35" data-width="1080" data-height="1920">

    <!-- 场景1: 封面 (0-3s) -->
    <div id="cover" class="clip" data-start="0" data-duration="3" data-track-index="1">
      <div class="cover-title">🐄 牛吃草问题</div>
      <div class="cover-sub">Manim 公式 + HyperFrames 场景</div>
    </div>

    <!-- 场景2: 牛吃草动画 (3-9s) -->
    <div id="field_scene" class="clip" data-start="3" data-duration="6" data-track-index="2">
      <div style="font-size:48px; color:#fff;">🌿 草地上的牛</div>
      <div class="field" id="field" style="margin-top: 40px;">
        <div class="cow" id="cow" style="opacity:0;">🐄</div>
      </div>
      <div style="font-size: 28px; color: #aaa; text-align: center; margin-top: 40px; line-height: 1.6;">
        27头牛 6天吃完 · 23头牛 9天吃完<br>
        <span style="color:#4ecdc4; font-size:36px;">21头牛几天吃完？</span>
      </div>
    </div>

    <!-- 场景3: Manim 公式推导 (9-23s) — 嵌入 Manim 关键帧 -->
    <div id="manim_scene" class="clip" data-start="9" data-duration="14" data-track-index="3">
      <div id="manim-container" style="width:1080px;height:1920px;position:relative;">
        <!-- 26帧 Manim 图片，每帧约0.5s，覆盖14s -->
      </div>
    </div>

    <!-- 场景4: 答案 (23-35s) -->
    <div id="answer_scene" class="clip" data-start="23" data-duration="12" data-track-index="4">
      <div class="section-tag">🎯 最终答案</div>
      <div class="formula-card">
        <div class="formula-text">每天新草：12 份</div>
        <div class="formula-text green">原有草：90 份</div>
        <div class="formula-text red" style="margin-top:20px;">21 - 12 = <span class="highlight">9 份/天</span></div>
        <div style="margin-top: 40px; text-align: center;">
          <div class="formula-text" style="font-size: 52px; color: #aaa;">90 ÷ 9 =</div>
          <div class="answer-big">10 天 ✅</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // 确定性种子随机数
    function mulberry32(a) { return function() { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; } }
    const rng = mulberry32(42);

    // 生成草地
    const field = document.getElementById('field');
    for (let i = 0; i < 50; i++) {
      const blade = document.createElement('div');
      blade.className = 'grass-blade';
      blade.style.left = (rng() * 800) + 'px';
      blade.style.height = '0px';
      blade.style.width = (3 + rng() * 3) + 'px';
      blade.dataset.targetH = (20 + rng() * 60);
      field.appendChild(blade);
    }

    // 生成 Manim 帧（26帧，每帧展示约0.54s）
    const manimContainer = document.getElementById('manim-container');
    const totalFrames = 26;
    const frameDuration = 14 / totalFrames; // ≈0.54s 每帧
    const frameElements = [];
    for (let i = 1; i <= totalFrames; i++) {
      const div = document.createElement('div');
      div.className = 'manim-frame';
      div.style.opacity = '0';
      const num = String(i).padStart(3, '0');
      div.innerHTML = '<img src="frames/formula_' + num + '.png" />';
      manimContainer.appendChild(div);
      frameElements.push(div);
    }

    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // 场景1: 封面
    tl.from("#cover .cover-title", { opacity: 0, y: -50, duration: 0.8, ease: "back.out(1.7)" }, 0.2);
    tl.from("#cover .cover-sub", { opacity: 0, y: 20, duration: 0.6 }, 0.8);

    // 场景2: 牛吃草
    tl.from("#field_scene", { opacity: 0, duration: 0.3 }, 3.0);
    gsap.set(".grass-blade", { scaleY: 0, transformOrigin: "bottom center" });
    tl.to(".grass-blade", { scaleY: 1, duration: 1.5, stagger: 0.02, ease: "power2.out", transformOrigin: "bottom center" }, 3.3);
    tl.to("#cow", { opacity: 1, duration: 0.5, ease: "back.out(2)" }, 3.6);
    tl.to("#cow", { x: 600, y: 50, duration: 2.5, ease: "power1.inOut" }, 4.0);
    tl.to(".grass-blade", { scaleY: 0, duration: 1.2, stagger: { each: 0.03, from: "start" }, ease: "power2.in", transformOrigin: "bottom center" }, 5.0);
    tl.to(".grass-blade", { scaleY: 0.6, duration: 1.0, stagger: 0.02, ease: "power2.out", transformOrigin: "bottom center" }, 6.5);

    // 场景3: Manim 帧 — 逐帧淡入展示
    frameElements.forEach((frame, i) => {
      const startTime = 9.0 + i * frameDuration;
      // 前一帧淡出，当前帧淡入
      if (i > 0) {
        tl.to(frameElements[i-1], { opacity: 0, duration: 0.2 }, startTime);
      }
      tl.to(frame, { opacity: 1, duration: 0.3 }, startTime);
    });

    // 场景4: 答案
    tl.from("#answer_scene .section-tag", { opacity: 0, y: -20, duration: 0.4 }, 23.2);
    tl.from(".formula-card .formula-text", { opacity: 0, x: -30, duration: 0.4, stagger: 0.4 }, 23.6);
    tl.from(".answer-big", { opacity: 0, scale: 0.5, duration: 0.8, ease: "back.out(2)" }, 25.5);

    window.__timelines["main"] = tl;
  </script>
</body>
</html>
