<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百都销售看板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 16px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1e293b;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #f8fafc;
        }
        .header .badge {
            background: #3b82f6;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: #1e293b;
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #334155;
        }
        .stat-card .label {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .stat-card .value {
            font-size: 24px;
            font-weight: 700;
            color: #f8fafc;
        }
        .stat-card .change {
            font-size: 11px;
            margin-top: 2px;
        }
        .change.up { color: #22c55e; }
        .change.down { color: #ef4444; }
        .change.neutral { color: #94a3b8; }
        .section {
            background: #1e293b;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #334155;
        }
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .customer-list {
            list-style: none;
        }
        .customer-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 4px;
            background: #0f172a;
            cursor: pointer;
            transition: background 0.15s;
        }
        .customer-item:hover { background: #1e293b; }
        .customer-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .customer-name {
            font-size: 13px;
            font-weight: 500;
            color: #e2e8f0;
        }
        .customer-industry {
            font-size: 11px;
            color: #64748b;
        }
        .tier-badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }
        .tier-a { background: #dc2626; color: white; }
        .tier-b { background: #f59e0b; color: white; }
        .tier-c { background: #3b82f6; color: white; }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .status-new { background: #22c55e; }
        .status-contacted { background: #f59e0b; }
        .status-interest { background: #3b82f6; }
        .status-deal { background: #8b5cf6; }
        .status-given-up { background: #64748b; }
        .progress-bar {
            height: 4px;
            background: #334155;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s;
        }
        .industry-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #1e293b;
        }
        .industry-row:last-child { border-bottom: none; }
        .industry-name {
            font-size: 12px;
            color: #cbd5e1;
        }
        .industry-count {
            font-size: 11px;
            color: #64748b;
            background: #334155;
            padding: 1px 6px;
            border-radius: 8px;
        }
        .action-bar {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .action-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }
        .btn-secondary:hover { background: #475569; }
        .tab-bar {
            display: flex;
            gap: 2px;
            background: #0f172a;
            padding: 3px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .tab {
            flex: 1;
            padding: 6px 12px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.15s;
        }
        .tab.active {
            background: #3b82f6;
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 12px;
        }
        .update-time {
            font-size: 10px;
            color: #475569;
            text-align: right;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏢 百都销售看板</h1>
        <span class="badge">workspace-baiduagent</span>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="label">今日拨打</div>
            <div class="value" id="stat-calls">0</div>
            <div class="change neutral">目标: 20通</div>
        </div>
        <div class="stat-card">
            <div class="label">接通率</div>
            <div class="value" id="stat-connect">--%</div>
            <div class="change neutral">有效通话</div>
        </div>
        <div class="stat-card">
            <div class="label">有意向</div>
            <div class="value" id="stat-interest">0</div>
            <div class="change neutral">需跟进</div>
        </div>
        <div class="stat-card">
            <div class="label">已成交</div>
            <div class="value" id="stat-deal">0</div>
            <div class="change neutral">本月累计</div>
        </div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="daily-progress" style="width:0%;background:#3b82f6;"></div>
    </div>
    <div class="update-time" id="update-time">最后更新: --</div>

    <div class="tab-bar">
        <button class="tab active" data-tab="today">今日清单</button>
        <button class="tab" data-tab="industry">行业分布</button>
        <button class="tab" data-tab="pipeline">客户漏斗</button>
    </div>

    <!-- 今日清单 -->
    <div class="section" id="tab-today">
        <div class="section-title">📞 今日拨打清单</div>
        <ul class="customer-list" id="today-list">
            <li class="empty-state">暂无今日客户，请先配置拨打清单</li>
        </ul>
        <div class="action-bar">
            <button class="action-btn btn-primary" onclick="refreshData()">🔄 刷新数据</button>
            <button class="action-btn btn-secondary" onclick="navigateTo('call')">📋 录入通话</button>
        </div>
    </div>

    <!-- 行业分布 -->
    <div class="section" id="tab-industry" style="display:none;">
        <div class="section-title">📊 蓝海行业分布</div>
        <div id="industry-list"></div>
    </div>

    <!-- 客户漏斗 -->
    <div class="section" id="tab-pipeline" style="display:none;">
        <div class="section-title">🎯 客户状态漏斗</div>
        <div id="pipeline-list"></div>
    </div>

    <script>
        // Canvas panel JS - interacts with Gateway
        const canvasApi = window.__OPENCLAW_CANVAS_API__;
        
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('[id^="tab-"]').forEach(s => s.style.display = 'none');
                document.getElementById('tab-' + tab.dataset.tab).style.display = 'block';
            });
        });

        // Load data from workspace
        async function loadWorkspace() {
            try {
                // Try to read workspace data via gateway
                const response = await fetch('/__openclaw__/a2ui/');
                // Data will be populated by the backend
            } catch(e) {
                console.log('Canvas API not available, using mock data');
            }
        }

        // Mock data for display
        const mockData = {
            calls: 0,
            connectRate: '--',
            interest: 0,
            deals: 0,
            todayCustomers: [],
            industries: [
                { name: '🔥 医疗器械生物医药', count: 78, color: '#22c55e' },
                { name: '🔥 新材料化工', count: 153, color: '#3b82f6' },
                { name: '🔥 新能源充电电力', count: 53, color: '#f59e0b' },
                { name: '🔥 低空经济', count: 25, color: '#8b5cf6' },
                { name: '🔥 环保检测', count: 63, color: '#ec4899' },
                { name: '📦 机械装备汽配', count: 438, color: '#64748b' },
                { name: '🍖 食品农业', count: 123, color: '#64748b' },
                { name: '🏗️ 建筑建材装修', count: 94, color: '#64748b' },
                { name: '💻 软件IT人工智能', count: 54, color: '#64748b' },
                { name: '📦 包装印刷', count: 45, color: '#64748b' },
            ],
            pipeline: [
                { status: '待联系', count: 2275, color: '#94a3b8' },
                { status: '已联系', count: 0, color: '#f59e0b' },
                { status: '有意向', count: 0, color: '#3b82f6' },
                { status: '已成交', count: 0, color: '#22c55e' },
                { status: '放弃', count: 0, color: '#64748b' },
            ]
        };

        function renderToday() {
            const list = document.getElementById('today-list');
            if (mockData.todayCustomers.length === 0) {
                list.innerHTML = '<li class="empty-state">📋 点击「生成今日清单」从蓝海行业提取Top10客户</li>';
                return;
            }
            list.innerHTML = mockData.todayCustomers.map(c => `
                <li class="customer-item">
                    <div class="customer-info">
                        <span class="status-dot status-${c.status}"></span>
                        <div>
                            <div class="customer-name">${c.name}</div>
                            <div class="customer-industry">${c.industry} · ${c.phone || '电话待验证'}</div>
                        </div>
                    </div>
                    <span class="tier-badge tier-${c.tier}">${c.tier}级</span>
                </li>
            `).join('');
        }

        function renderIndustry() {
            const list = document.getElementById('industry-list');
            list.innerHTML = mockData.industries.map(ind => `
                <div class="industry-row">
                    <span class="industry-name">${ind.name}</span>
                    <span class="industry-count">${ind.count}家</span>
                </div>
            `).join('');
        }

        function renderPipeline() {
            const list = document.getElementById('pipeline-list');
            list.innerHTML = mockData.pipeline.map(p => `
                <div class="industry-row">
                    <span class="industry-name">${p.status}</span>
                    <span class="industry-count">${p.count}家</span>
                </div>
            `).join('');
        }

        function refreshData() {
            document.getElementById('update-time').textContent = 
                '最后更新: ' + new Date().toLocaleTimeString('zh-CN');
            // Trigger gateway to refresh data
            if (canvasApi) {
                canvasApi.postMessage({ type: 'refresh' });
            }
        }

        function navigateTo(page) {
            // Deep link to sub-page
            window.location.href = 'openclaw://agent?message=打开%20百都CRM-%20' + page;
        }

        // Init
        renderToday();
        renderIndustry();
        renderPipeline();
        loadWorkspace();
    </script>
</body>
</html>
